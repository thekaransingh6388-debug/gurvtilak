  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0; padding: 0;
      background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
      color: #fff;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background: url('https://www.transparenttextures.com/patterns/cubes.png');
    }
    .glass-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 40px 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      max-width: 650px;
      width: 100%;
    }
    .logo img {
      width: 120px; height: 120px;
      border-radius: 50%;
      border: 3px solid #ffcc00;
      object-fit: cover;
      margin-bottom: 20px;
      transition: transform 0.3s ease;
    }
    .logo img:hover {
      transform: scale(1.08);
    }
    h1 {
      font-weight: 700;
      color: #ffcc00;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .crown {
      color: gold;
      animation: shine 2s infinite linear;
    }
    @keyframes shine {
      0% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
      100% { opacity: 0.6; transform: scale(1); }
    }
    h2 {
      font-weight: 600;
      margin-top: 30px;
      color: #00ffb3;
    }
    p {
      color: #ddd;
      margin: 10px 0;
      font-size: 16px;
    }
    a.cta-btn {
      background: linear-gradient(90deg, #0072ff, #00c6ff);
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 18px;
      color: #fff;
      font-weight: 600;
      display: inline-block;
      margin: 18px 0;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 198, 255, 0.4);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0,198,255,0.7); }
      70% { box-shadow: 0 0 0 20px rgba(0,198,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,198,255,0); }
    }
    .highlight {
      color: #00ff88;
      font-weight: 600;
    }
    .stats {
      display: flex;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
      gap: 12px;
    }
    .stat-box {
      background: rgba(255,255,255,0.08);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }
    .benefits {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
    }
    .benefit-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 12px;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
    }
    footer {
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Easy Variables (updated with new logo & channel link) -->
  <script>
    const SITE_NAME = "PANKAJ BHARDWAJ OFFICIAL ™";           // Brand Name
    const SITE_IMAGE = "https://karanmetalabe.com/wp-content/uploads/2026/08/images-21.jpg"; // NEW LOGO
    const TELEGRAM_LINK = "https://t.me/+4FLFGfjVI1IzZGVl";    // NEW CHANNEL LINK
  </script>

  <section class="hero">
    <div class="glass-box">
      <div class="logo">
        <img id="site-logo" alt="Brand Logo">
      </div>
      <h1 id="site-heading"></h1>
      <p>✅ Trusted by thousands of learners</p>

      <div class="stats">
        <div class="stat-box">24/7 Updates</div>
        <div class="stat-box">Free to Join</div>
      </div>

      <!-- CTA Button 1 with event tracking (Facebook Pixel) -->
      <a id="cta-btn-1" class="cta-btn" onclick="fbq('track', 'JoinTelegram');">
        <i class="fa-brands fa-telegram me-1"></i> Join on Telegram
      </a>

      <div class="benefits">
        <div class="benefit-card"><i class="fa-solid fa-check-circle highlight"></i> Market Insights & Discussions</div>
        <div class="benefit-card"><i class="fa-solid fa-check-circle highlight"></i> Learn with Experts</div>
        <div class="benefit-card"><i class="fa-solid fa-check-circle highlight"></i> Practical Strategies</div>
      </div>

      <!-- CTA Button 2 (also tracked) -->
      <a id="cta-btn-2" class="cta-btn" onclick="fbq('track', 'JoinTelegram');" style="margin-top:10px; animation: none; background: linear-gradient(90deg, #f7971e, #ffd200); box-shadow: 0 4px 15px rgba(255, 210, 0, 0.4);">
        <i class="fa-brands fa-telegram me-1"></i> Join Telegram Channel
      </a>

      <footer>
        © 2026 PANKAJ BHARDWAJ • All rights reserved
      </footer>
    </div>
  </section>

  <!-- Auto apply variables and attach click tracking (ensure pixel fires on CTA) -->
  <script>
    (function() {
      // set dynamic content
      document.getElementById("site-title").innerText = SITE_NAME;
      document.getElementById("site-heading").innerHTML = 
        `<i class="fa-solid fa-crown crown"></i> ${SITE_NAME} <i class="fa-solid fa-crown crown"></i>`;
      document.getElementById("site-logo").src = SITE_IMAGE;
      
      // set href for both CTA buttons
      const cta1 = document.getElementById("cta-btn-1");
      const cta2 = document.getElementById("cta-btn-2");
      if (cta1) cta1.href = TELEGRAM_LINK;
      if (cta2) cta2.href = TELEGRAM_LINK;

      console.log("✅ New Pixel (814001441735615) + new logo + new channel + event tracking applied.");
    })();
  </script>

  <!-- Additional event tracking: ensure pixel fires on every CTA click, even if inline is bypassed -->
  <script>
    (function() {
      const btns = document.querySelectorAll('.cta-btn');
      btns.forEach(btn => {
        btn.addEventListener('click', function(e) {
          // track event (redundant but safe)
          if (typeof fbq === 'function') {
            fbq('track', 'JoinTelegram');
          }
          // allow default navigation (href)
        });
      });
    })();
  </script>
